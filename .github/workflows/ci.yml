name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f compose/simple-stack/docker-compose.yml config --quiet
          docker compose -f compose/api-db-nginx/docker-compose.yml config --quiet
          docker compose -f compose/multi-service-app/docker-compose.yml config --quiet
          docker compose -f observability/docker-compose.yml config --quiet
          docker compose -f private-registry/docker-compose.yml config --quiet

      - name: Validate shell scripts (syntax check)
        run: find . -name "exercises.sh" -exec bash -n {} \; -print

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: basics/images-build
            context: ./basics/images-build

          - name: images/multistage (test gate)
            context: ./images/multistage
            target: test

          - name: images/multistage (final)
            context: ./images/multistage

          - name: images/distroless
            context: ./images/distroless

          - name: images/nginx-example
            context: ./images/nginx-example

          - name: storage/volumes
            context: ./storage/volumes

          - name: performance/cpu-memory-stress
            context: ./performance/cpu-memory-stress

          - name: security/user-permissions
            context: ./security/user-permissions

          - name: security/distroless
            context: ./security/distroless

          - name: security/secrets-basics
            context: ./security/secrets-basics

          - name: compose/simple-stack
            context: ./compose/simple-stack/app
            image_name: simple-stack

          - name: compose/multi-service-app
            context: ./compose/multi-service-app/app
            image_name: multi-service-app

          - name: compose/api-db-nginx
            context: ./compose/api-db-nginx/app
            image_name: api

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        if: matrix.image_name != ''
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "value=ghcr.io/${OWNER}/docker-lab-${{ matrix.image_name }}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && matrix.image_name != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.ref == 'refs/heads/main' && matrix.image_name != '' }}
          tags: ${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
