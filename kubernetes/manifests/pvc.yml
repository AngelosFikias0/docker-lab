---
# PersistentVolumeClaim — request 1Gi of storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-data
spec:
  accessModes:
    - ReadWriteOnce     # one node can mount read/write at a time
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard  # kind provides "standard" by default

---
# Pod that mounts the PVC
apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'hello from PVC' >> /data/out.txt && sleep 3600"]
      volumeMounts:
        - mountPath: /data
          name: persistent-data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: lab-data
