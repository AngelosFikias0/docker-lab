global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # drop high-cardinality metrics not needed for this lab
      - source_labels: [__name__]
        regex: "container_tasks_state|container_memory_failures_total"
        action: drop
